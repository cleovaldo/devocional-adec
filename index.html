<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Configurações para Miniatura e Pré-visualização no WhatsApp (Open Graph) -->
<meta property="og:site_name" content="Devocional ADEC" />
<meta property="og:title" content="Ame Pregar - Pr. Cleovaldo Batista" />
<meta property="og:description" content="Oratória para Jovens | Toque para ouvir." />
<meta property="og:url" content="https://cleovaldo.github.io/devocional-adec/" />
<meta property="og:image" content="https://cleovaldo.github.io/devocional-adec/cleovaldo.png" />
<meta property="og:image:secure_url" content="https://cleovaldo.github.io/devocional-adec/cleovaldo.png" /> 
<meta property="og:image:type" content="image/png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:type" content="website" />

<title>Ame Pregar - Devocional ADEC</title>

<!-- Fontes Modernas & Elegantes -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  * { 
    box-sizing: border-box; 
    margin: 0;
    padding: 0;
  }
  
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: #ffffff;
    background-color: #0f141d; /* Cor de fundo escura e limpa */
    /* Caso queira reativar a imagem da igreja no fundo geral, descomente a linha abaixo: */
    /* background: linear-gradient(180deg, rgba(12, 16, 26, 0.60) 0%, rgba(6, 8, 14, 0.85) 100%), url('fundo-igreja.png') center/cover no-repeat fixed; */
    position: relative;
    overflow-x: hidden;
  }

  /* Logo de Vidro no Canto Superior Direito */
  .header-logo {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 65px;
    height: auto;
    background: rgba(255, 255, 255, 0.88);
    padding: 6px;
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: 100;
  }

  .container {
    width: 100%;
    max-width: 380px;
  }

  /* Card do Player em Proporção Exata 9:16 com Background Removido */
  .player-card {
    position: relative;
    width: 100%;
    aspect-ratio: 9 / 16;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background: transparent; /* Fundo do cartão removido */
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    border: none; /* Borda removida */
    padding: 12px 0;
    box-shadow: none; /* Sombra externa removida */
    overflow: hidden;
  }

  .card-header {
    margin-bottom: 12px;
  }

  .brand-badge {
    display: inline-block;
    font-family: 'Outfit', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #ffd79d;
    background: rgba(255, 215, 157, 0.12);
    border: 1px solid rgba(255, 215, 157, 0.25);
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 8px;
  }

  h1 {
    font-family: 'Outfit', sans-serif;
    font-size: 28px;
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #ffffff 0%, #d8e2fd 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 2px;
  }

  .subtitle {
    font-size: 13px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.7);
    margin-bottom: 12px;
  }

  .tagline {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.9);
    padding: 4px 10px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 10px;
    border-left: 3px solid #ffd79d;
  }

  .image-wrapper {
    position: relative;
    width: 100%;
    flex: 1;
    max-height: 260px;
    border-radius: 18px;
    overflow: hidden;
    margin: 12px 0;
    box-shadow: 0 12px 25px rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.15);
  }

  .speaker-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
  }

  .image-overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 40%;
    background: linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, rgba(10, 14, 23, 0.8) 100%);
  }

  .card-footer {
    width: 100%;
  }

  .devocional-title {
    font-family: 'Outfit', sans-serif;
    font-size: 20px;
    font-weight: 600;
    color: #ffffff;
    margin-bottom: 12px;
    line-height: 1.2;
  }

  .audio-container {
    background: rgba(255, 255, 255, 0.08);
    padding: 6px;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.12);
  }

  audio {
    width: 100%;
    height: 40px;
    outline: none;
    border-radius: 10px;
  }

  audio::-webkit-media-controls-panel {
    background-color: rgba(255, 255, 255, 0.92);
  }
</style>
</head>

<body>
  <!-- Logo no Canto Superior Direito -->
  <img src="LogoAD.png" alt="Assembleia de Deus" class="header-logo">

  <main class="container">
    <div class="player-card">
      
      <header class="card-header">
        <span class="brand-badge">ADEC</span>
        <h1>Ame Pregar</h1>
        <p class="subtitle">Pr. Cleovaldo Batista</p>
        <div class="tagline">Oratória para Jovens</div>
      </header>

      <div class="image-wrapper">
        <img src="BillyGraham.jpg" alt="Billy Graham" class="speaker-image">
        <div class="image-overlay"></div>
      </div>

      <footer class="card-footer">
        <h2 class="devocional-title">A importância da Voz - Parte 2</h2>

        <div class="audio-container">
          <audio controls preload="metadata">
            <source src="Devocional.mp3" type="audio/mpeg">
            Seu navegador não suporta a reprodução de áudio.
          </audio>
        </div>
      </footer>

    </div>
  </main>
</body>
</html>
