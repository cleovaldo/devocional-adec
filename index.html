<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Meta Tags para Pré-visualização no WhatsApp -->
<meta property="og:title" content="Devocional ADEC - Ame sua rotina" />
<meta property="og:description" content="Uma palavra de fé para abençoar o seu dia. Toque para ouvir." />
<meta property="og:url" content="https://cleovaldo.github.io/devocional-adec/" />
<meta property="og:image" content="https://cleovaldo.github.io/devocional-adec/fundo-igreja.png" />
<meta property="og:type" content="website" />

<title>Devocional ADEC</title>

<!-- Fontes Elegantes -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; }
  
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: 'Montserrat', sans-serif;
    color: #ffffff;
    background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.65)), url('fundo-igreja.png') center/cover no-repeat fixed;
    position: relative;
  }

  /* Logo posicionada no canto superior direito */
  .header-logo {
    position: absolute;
    top: 24px;
    right: 24px;
    width: 75px;
    height: auto;
    background: rgba(255, 255, 255, 0.9);
    padding: 6px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 10;
  }

  .container {
    width: 100%;
    max-width: 380px;
    text-align: left;
    padding: 20px;
    margin-top: 40px;
  }

  .brand {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.75;
    margin-bottom: 8px;
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 38px;
    font-weight: 400;
    margin: 0 0 6px 0;
    line-height: 1.1;
  }

  .subtitle {
    font-size: 13px;
    font-weight: 300;
    opacity: 0.8;
    margin: 0 0 30px 0;
    letter-spacing: 0.5px;
  }

  /* Detalhe estético com barra vertical */
  .tagline {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    letter-spacing: 1px;
    margin-bottom: 25px;
    opacity: 0.9;
  }

  .tagline::before {
    content: '';
    display: inline-block;
    width: 2px;
    height: 22px;
    background-color: #ffffff;
  }

  /* Cartão Translúcido do Player */
  .player-card {
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 20px;
    padding: 24px 20px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    text-align: center;
  }

  /* Capa com a Foto do Billy Graham */
  .speaker-image {
    width: 100%;
    height: 200px;
    object-fit: cover;
    object-position: top;
    border-radius: 14px;
    margin-bottom: 18px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
  }

  .devocional-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px;
    font-weight: 600;
    margin: 0 0 15px 0;
    color: #ffffff;
    text-align: left;
  }

  audio {
    width: 100%;
    height: 40px;
    border-radius: 10px;
    margin-bottom: 15px;
    outline: none;
  }

  audio::-webkit-media-controls-panel {
    background-color: rgba(255, 255, 255, 0.9);
  }

  .hint {
    font-size: 12px;
    opacity: 0.75;
    text-align: center;
    margin: 0 0 20px 0;
  }

  .spotify {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 12px;
    border-radius: 30px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    color: #ffffff;
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.3);
    transition: all 0.3s ease;
  }

  .spotify:active {
    background: rgba(255, 255, 255, 0.3);
  }

  .spotify-icon {
    width: 16px;
    height: 16px;
    fill: currentColor;
  }
</style>
</head>

<body>
  <!-- Logo no Canto Superior Direito -->
  <img src="LogoAD.png" alt="Assembleia de Deus" class="header-logo">

  <main class="container">
    <div class="brand">ADEC</div>
    <h1>Ame Pregar</h1>
    <p class="subtitle">Pr. Cleovaldo Batista</p>

    <div class="tagline">Oratória para Jovens</div>

    <div class="player-card">
      <!-- Foto do Billy Graham como capa do player -->
      <img src="BillyGraham.jpg" alt="Billy Graham" class="speaker-image">

      <h2 class="devocional-title">A importância da Voz</h2>

      <audio controls preload="metadata">
        <source src="Devocional.mp3" type="audio/mpeg">
        Seu navegador não suporta a reprodução de áudio.
      </audio>

      <p class="hint">Toque em ▶ para ouvir a mensagem</p>

      <a class="spotify"
         href="https://open.spotify.com/episode/1k80uK7i2O0AQsSDDM6w0T"
         target="_blank"
         rel="noopener">
         <svg class="spotify-icon" viewBox="0 0 24 24"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.503 17.306c-.22.361-.692.476-1.053.256-2.887-1.764-6.521-2.162-10.803-1.182-.413.095-.824-.162-.919-.575-.095-.413.162-.824.575-.919 4.697-1.072 8.706-.618 11.944 1.359.361.22.476.692.256 1.053zm1.47-3.26c-.277.452-.867.601-1.319.324-3.303-2.03-8.339-2.616-12.246-1.428-.51.156-1.053-.136-1.209-.646-.156-.51.136-1.053.646-1.209 4.453-1.355 10.006-.704 13.804 1.628.452.277.601.867.324 1.319zm.139-3.385C15.222 8.164 8.707 7.947 4.93 9.094c-.58.176-1.196-.164-1.372-.744-.176-.58.164-1.196.744-1.372 4.332-1.314 11.531-1.066 16.035 1.609.522.311.691.987.38 1.509-.311.522-.987.691-1.509.38z"/></svg>
         Ouvir no Spotify
      </a>
    </div>
  </main>
</body>
</html>
